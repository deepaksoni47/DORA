version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: dora-db
    environment:
      POSTGRES_DB: dora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: dora-backend
    depends_on:
      - database
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/dora_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      # Add your API keys here for local testing
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      GITHUB_API_KEY: ${GITHUB_API_KEY:-}
    ports:
      - "8080:8080"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dora-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      NODE_ENV: development
    ports:
      - "3000:3000"
    restart: always

volumes:
  postgres_data:
